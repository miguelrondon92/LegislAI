<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Workflow Admin - LegislAI{% endblock %}</title>
    
    <!-- Bootstrap CSS with dark theme -->
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    
    <style>
        .admin-header {
            background: linear-gradient(135deg, #dc3545 0%, #a71e2a 100%);
            border-bottom: 2px solid #dc3545;
        }
        .admin-badge {
            background-color: #dc3545;
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 3px;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <!-- Admin Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark admin-header">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('rss_dashboard') }}">
                <i data-feather="settings" class="me-2"></i>
                LegislAI Admin
                <span class="admin-badge">ADMIN</span>
            </a>
            
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('rss_dashboard') }}">
                    <i data-feather="rss" class="me-1"></i>RSS
                </a>
                <a class="nav-link" href="{{ url_for('backfill_dashboard') }}">
                    <i data-feather="database" class="me-1"></i>Backfill
                </a>
                <a class="nav-link" href="/health" target="_blank">
                    <i data-feather="heart" class="me-1"></i>Health
                </a>
                <a class="nav-link" href="{{ url_for('admin_logout') }}">
                    <i data-feather="log-out" class="me-1"></i>Logout
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-4">
        {% block content %}
        <div class="text-center py-5">
            <h1 class="display-4 mb-4">
                <i data-feather="settings" class="me-3"></i>
                Workflow Administration
            </h1>
            <p class="lead text-muted">
                Administrative interface for managing the legislative analysis workflow system.
            </p>
        </div>
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-dark border-top mt-5 py-4">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <p class="text-muted mb-0">
                        <i data-feather="shield" class="me-1"></i>
                        LegislAI Workflow Admin Service
                    </p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="text-muted mb-0">
                        <i data-feather="server" class="me-1"></i>
                        Microservice Architecture
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Initialize Feather Icons -->
    <script>
        feather.replace();
    </script>
    
    <!-- Page-specific scripts -->
    {% block scripts %}{% endblock %}
</body>
</html>
