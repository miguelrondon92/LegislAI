services:
  web:
    build: .
    ports:
      - "5055:5000"
    env_file:
      - .env
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "false"
      PORT: "5000"
      DATABASE_URL: sqlite:////app/data/legislative_analysis.db
      NOTIFICATIONS_ENABLED: "false"
    volumes:
      - legislai-data:/app/data
      - legislai-logs:/app/logs
    restart: unless-stopped

volumes:
  legislai-data:
  legislai-logs:
